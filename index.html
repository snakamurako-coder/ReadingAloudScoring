<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>英語音読スコアリング</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #111827;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pill {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: #e0e7ff;
      color: #3730a3;
      font-weight: 700;
      vertical-align: middle;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid rgba(0, 0, 0, 0.02);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media(max-width: 640px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: #fff;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    input:disabled,
    select:disabled,
    button:disabled,
    textarea:disabled {
      background-color: #f9fafb;
      cursor: not-allowed;
      opacity: 0.7;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.95rem;
    }

    button.primary {
      background: var(--primary);
      color: white;
    }

    button.primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    button.secondary {
      background: #fff;
      border: 1px solid var(--border);
      color: #374151;
    }

    button.secondary:hover:not(:disabled) {
      background: #f9fafb;
      border-color: #d1d5db;
    }

    button.accent {
      background: #111827;
      color: white;
    }

    .inline-controls {
      display: flex;
      gap: 8px;
    }

    .meter-wrap {
      background: #f3f4f6;
      border-radius: 999px;
      height: 12px;
      overflow: hidden;
      flex: 1;
      position: relative;
    }

    .meter-bar {
      height: 100%;
      background: linear-gradient(90deg, #60a5fa, #34d399);
      width: 0%;
      transition: width 0.1s linear;
    }

    .status-badge {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 6px;
      background: #f3f4f6;
      color: #4b5563;
      border: 1px solid #e5e7eb;
    }

    .status-badge.ok {
      background: #ecfdf5;
      color: #065f46;
      border-color: #a7f3d0;
    }

    .status-badge.warn {
      background: #fffbeb;
      color: #92400e;
      border-color: #fde68a;
    }

    /* Text Display Area */
    .display-container {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fafafa;
      padding: 4px;
    }

    .display-text {
      font-family: Georgia, Cambria, "Times New Roman", Times, serif;
      font-size: 1.15rem;
      line-height: 1.8;
      border: none;
      background: transparent;
      resize: vertical;
      min-height: 180px;
      color: #111827;
      box-shadow: none;
      /* remove focus ring for readonly */
    }

    .display-text:focus {
      box-shadow: none;
      border: none;
    }

    .scroll-overlay {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
    }

    .scroll-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      padding: 0;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #d1d5db;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      font-size: 12px;
    }

    /* Shadowing Audio Player */
    .shadowing-box {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      padding: 16px;
      margin-top: 12px;
    }

    .countdown {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--primary);
      width: 40px;
      text-align: center;
    }

    /* Result Section */
    .result-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    @media(max-width: 768px) {
      .result-grid {
        grid-template-columns: 1fr;
      }
    }

    .score-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 800;
      margin: 0 auto;
      border: 8px solid #e5e7eb;
      color: #9ca3af;
    }

    .score-circle.good {
      border-color: var(--success);
      color: var(--success);
      background: #ecfdf5;
    }

    .score-circle.med {
      border-color: var(--warning);
      color: var(--warning);
      background: #fffbeb;
    }

    .score-circle.bad {
      border-color: var(--danger);
      color: var(--danger);
      background: #fef2f2;
    }

    .diff-box {
      font-family: 'Menlo', 'Monaco', monospace;
      font-size: 0.9rem;
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      line-height: 1.6;
      margin-top: 8px;
    }

    .tok.miss {
      color: var(--danger);
      text-decoration: underline;
      text-decoration-color: rgba(239, 68, 68, 0.4);
    }

    .tok.add {
      color: var(--warning);
      background: rgba(245, 158, 11, 0.1);
    }

    .flex-center {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .flex-wrap {
      flex-wrap: wrap;
    }

    .miss-word-btn {
      background: white;
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 4px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .miss-word-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .miss-word-btn[aria-pressed="true"] {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .loader {
      border: 2px solid #f3f3f3;
      border-top: 2px solid var(--primary);
      border-radius: 50%;
      width: 14px;
      height: 14px;
      animation: spin 1s linear infinite;
      display: inline-block;
      margin-right: 5px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-top: 40px;
      padding: 10px 0;
      border-top: 1px solid var(--border);
      width: 100%;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }

    footer a {
      color: #666;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>
      <span>📚 Reading Aloud Scoring</span>
      <span class="pill">Apps Script</span>
    </h1>

    <!-- Config Card -->
    <div class="card">
      <div class="grid-2">
        <div>
          <label>生徒ID <span style="font-weight:400; color:#ef4444">*</span></label>
          <input id="studentId" type="text" maxlength="4" placeholder="例: 1234" autocomplete="off" />
        </div>
        <div>
          <label>氏名 <span style="font-weight:400; color:#ef4444">*</span></label>
          <input id="studentName" type="text" placeholder="例: 山田 太郎" autocomplete="off" />
        </div>
      </div>

      <div style="margin-top: 16px;">
        <label>ブック (学年/科目)</label>
        <div class="inline-controls">
          <select id="bookSelect">
            <option>読み込み中...</option>
          </select>
          <button id="refreshBooksBtn" class="secondary" title="再読み込み">🔄</button>
        </div>
      </div>

      <div style="margin-top: 12px;">
        <label>シート (単元)</label>
        <div class="inline-controls">
          <select id="sheetSelect" disabled>
            <option>— 選択してください —</option>
          </select>
          <button id="refreshSheetsBtn" class="secondary" disabled title="再読み込み">🔄</button>
        </div>
      </div>

      <div style="margin-top: 12px;">
        <label>パッセージ (課題文)</label>
        <div class="inline-controls">
          <select id="passageSelect" disabled>
            <option>— 選択してください —</option>
          </select>
          <button id="refreshPassagesBtn" class="secondary" disabled title="再読み込み">🔄</button>
        </div>
        <div style="font-size:0.75rem; color:var(--text-muted); margin-top:4px;">
          ※キャッシュ更新のため、スプレッドシート変更後は🔄ボタンを押してください。
        </div>
      </div>
    </div>

    <!-- Recording & Task Card -->
    <div class="card">
      <div class="flex-center flex-wrap" style="margin-bottom: 20px;">
        <button id="startBtn" class="accent" disabled style="padding: 12px 20px; font-size:1rem;">
          🎙️ 録音開始
        </button>
        <button id="stopBtn" class="secondary" disabled style="padding: 12px 20px; font-size:1rem;">
          ⏹ 停止
        </button>

        <div style="margin-left:auto; display:flex; gap:12px; align-items:center;">
          <label style="margin:0; font-weight:normal;">アクセント:</label>
          <select id="accentSelect" style="width:auto; padding:6px 10px;">
            <option value="en-US">🇺🇸 US</option>
            <option value="en-GB">🇬🇧 UK</option>
          </select>
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:12px; margin-bottom:8px;">
        <span style="font-size:0.8rem; font-weight:700; width:40px;">MIC</span>
        <div class="meter-wrap">
          <div id="meterBar" class="meter-bar"></div>
        </div>
        <button id="micCheckStartBtn" class="secondary" style="font-size:0.75rem; padding:4px 8px;">Check</button>
      </div>
      <div id="status" style="font-size:0.85rem; color:var(--text-muted); text-align:right;">Ready</div>

      <hr style="border:0; border-top:1px solid var(--border); margin: 20px 0;">

      <label>📖 Read this:</label>

      <!-- Text Display -->
      <div id="displayTextWrap" class="display-container">
        <div class="scroll-overlay">
          <button id="scrollUp" class="scroll-btn">▲</button>
          <button id="scrollDown" class="scroll-btn">▼</button>
        </div>
        <textarea id="displayText" class="display-text" readonly></textarea>
      </div>

      <!-- Shadowing Display -->
      <div id="shadowingWrap" class="shadowing-box" style="display:none;">
        <div class="flex-center flex-wrap">
          <label style="margin:0;">Speed:</label>
          <select id="shadowRate" style="width:auto;">
            <option value="0.6">0.6x</option>
            <option value="0.7">0.7x</option>
            <option value="0.8">0.8x</option>
            <option value="0.9">0.9x</option>
            <option value="1.0" selected>1.0x (Normal)</option>
            <option value="1.1">1.1x</option>
            <option value="1.2">1.2x</option>
          </select>
          <span class="countdown" id="shadowCountdown">—</span>
          <button id="shadowStopBtn" class="secondary" style="font-size:0.8rem;">Stop Audio</button>
        </div>
        <div id="shadowNote" style="font-size:0.8rem; color:var(--text-muted); margin-top:8px;"></div>
        <audio id="shadowAudio" style="display:none;"></audio>
      </div>
    </div>

    <!-- Results Card -->
    <div class="card">
      <div class="result-grid">
        <!-- Left: Diff -->
        <div>
          <label>📝 Speech Recognition Result</label>
          <textarea id="recognized" class="diff-box" rows="4" readonly placeholder="Waiting for result..."></textarea>

          <div style="margin-top:16px;">
            <label>🔍 Comparison (You vs. Text)</label>
            <div id="hypHighlighted" class="diff-box" style="min-height:80px;"></div>
          </div>
        </div>

        <!-- Right: Score & Actions -->
        <div style="text-align:center;">
          <label>Score</label>
          <div id="score" class="score-circle">—</div>
          <div id="metrics" style="font-size:0.75rem; color:var(--text-muted); margin-top:8px; font-family:monospace;">
          </div>
          <div id="shadowingScoreLine" style="font-weight:bold; color:var(--primary); margin-top:4px; display:none;">
          </div>

          <div style="margin-top:24px;">
            <button id="saveBtn" class="primary" disabled style="width:100%;">
              💾 提出する
            </button>
            <div id="submitStatusBottom" class="status-badge" style="margin-top:8px; display:inline-block;">未送信</div>
          </div>
        </div>
      </div>

      <!-- Missing Words Practice -->
      <div style="margin-top:24px;">
        <label>🎯 Practice Missed Words</label>
        <div id="missList" style="display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;">
          <span style="color:var(--text-muted); font-size:0.9rem;">No missed words.</span>
        </div>
      </div>
    </div>

    <input type="hidden" id="fullText" />

    <!-- Audio Preview (Hidden by default, for debugging) -->
    <div id="previewWrap" style="display:none; margin-top:20px; padding:10px; border:1px solid #ddd;">
      <audio id="previewAudio" controls></audio>
      <div id="previewMeta"></div>
      <div id="audioInfo"></div>
    </div>

  </div>

  <footer>
    © 2025 Kojiro Nakamura. All rights reserved.<br>
    Unauthorized reproduction or redistribution is prohibited.<br>
    Contact: <a href="mailto:snakamurako@yamagataps.jp">snakamurako@yamagataps.jp</a>
  </footer>

  <script>
    /* =========================================
       CORE LOGIC (Migrated from original)
       ========================================= */

    function $(id) { return document.getElementById(id); }
    function _s(v) { return v == null ? '' : String(v); }
    // Helper to escape HTML
    function escapeHtml(s) { return _s(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    /* --- Text Analysis Utility --- */
    function normalize(t) { return (t || "").toLowerCase().replace(/[“”"'’]/g, "").replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim(); }
    function tokenize(t) { t = normalize(t); return t ? t.split(" ") : []; }

    // Word Error Rate (Levenshtein based on words)
    function wer(r, h) {
      const R = tokenize(r), H = tokenize(h), N = R.length, M = H.length, dp = Array.from({ length: N + 1 }, () => Array(M + 1).fill(0));
      for (let i = 0; i <= N; i++)dp[i][0] = i; for (let j = 0; j <= M; j++)dp[0][j] = j;
      for (let i = 1; i <= N; i++)for (let j = 1; j <= M; j++) {
        const c = R[i - 1] === H[j - 1] ? 0 : 1;
        dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + c);
      }
      const d = dp[N][M]; return { wer: N ? d / N : 0, dist: d, refLen: N, hypLen: M };
    }

    function diffWordsWithIndex(r, h) {
      const R = tokenize(r), H = tokenize(h), n = R.length, m = H.length;
      const l = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));
      for (let i = 1; i <= n; i++)for (let j = 1; j <= m; j++)l[i][j] = (R[i - 1] === H[j - 1]) ? l[i - 1][j - 1] + 1 : Math.max(l[i - 1][j], l[i][j - 1]);
      const matchR = new Set(), matchH = new Set(); let i = n, j = m;
      while (i > 0 && j > 0) {
        if (R[i - 1] === H[j - 1]) { matchR.add(i - 1); matchH.add(j - 1); i--; j--; }
        else if (l[i - 1][j] >= l[i][j - 1]) i--; else j--;
      }
      const missedIdx = [], addedIdx = [];
      for (let k = 0; k < n; k++) if (!matchR.has(k)) missedIdx.push(k);
      for (let k = 0; k < m; k++) if (!matchH.has(k)) addedIdx.push(k);
      return { R, H, missedIdx, addedIdx, missed: missedIdx.map(k => R[k]), added: addedIdx.map(k => H[k]) };
    }

    function renderHighlighted(tokens, set, cls) {
      return tokens.map((tok, idx) => set.has(idx)
        ? `<span class="tok ${cls}">${escapeHtml(tok)}</span>`
        : `<span class="tok">${escapeHtml(tok)}</span>`).join(' ');
    }

    /* --- Scoring UI --- */
    function calcAndRender() {
      const ref = $('fullText').value;
      const h = $('recognized').value;

      const hasText = !!h.trim();
      $('saveBtn').disabled = !hasText;

      if (!ref.trim()) {
        // No logic without reference text
        $('score').textContent = '—'; $('score').className = 'score-circle';
        return;
      }

      const { wer: rate, dist, refLen, hypLen } = wer(ref, h);
      // Simple score: 1 - WER, floored at 0
      let score = Math.max(0, Math.round(100 * (1 - rate)));

      const elScore = $('score');
      elScore.textContent = score;
      elScore.className = 'score-circle ' + (score >= 80 ? 'good' : score >= 50 ? 'med' : 'bad');

      $('metrics').textContent = `WER:${rate.toFixed(2)} (Diff:${dist})`;

      // Diff Highlight
      const d = diffWordsWithIndex(ref, h);

      // We only show HYP (student's) text with additions highlighted? 
      // Actually standard is to show what they said, marking redundancy, 
      // AND show REF, marking missing. 
      // For simplicity in this UI, let's show one unified view or just the HYP view with "Add/Miss" indicators?
      // The original code separated them. Let's try to show meaningful feedback.
      // Re-using the prompt's logic:
      $('hypHighlighted').innerHTML = renderHighlighted(d.H, new Set(d.addedIdx), 'add');

      // Render Missed Words
      renderMissList(d.missed);

      if ($('shadowingWrap').style.display !== 'none') updateShadowingScoreLine();
    }

    /* --- TTS for Missed Words --- */
    function renderMissList(words) {
      const wrap = $('missList');
      if (!words || words.length === 0) {
        wrap.innerHTML = '<span style="color:var(--text-muted); font-size:0.9rem;">No missed words! 🎉</span>';
        return;
      }
      wrap.innerHTML = '';
      words.forEach(w => {
        const btn = document.createElement('button');
        btn.className = 'miss-word-btn';
        btn.innerHTML = `🔊 ${escapeHtml(w)}`;
        btn.onclick = () => speakWord(w, btn);
        wrap.appendChild(btn);
      });
    }

    function speakWord(word, btn) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = $('accentSelect').value || 'en-US';
      u.rate = 0.8;
      btn.setAttribute('aria-pressed', 'true');
      u.onend = () => btn.setAttribute('aria-pressed', 'false');
      window.speechSynthesis.speak(u);
    }

    /* --- Shadowing Logic --- */
    function updateShadowingScoreLine() {
      const base = Number($('score').textContent);
      if (isNaN(base)) return;
      const rate = Number($('shadowRate').value);
      const final = Math.min(100, Math.ceil(base * rate));
      const el = $('shadowingScoreLine');
      el.style.display = 'block';
      el.textContent = `Shadowing Score: ${final} (Base ${base} x ${rate})`;
    }

    /* --- Audio Recording Logic (Web Audio API) --- */
    let recognition, mediaRecorder, audioCtx, analyser, meterRAF;
    let keepRecognizing = false, listening = false;
    let recordedChunks = [], micCheckStream = null;

    async function startMicCheck() {
      try {
        if (micCheckStream) return;
        micCheckStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        setupMeter(micCheckStream);
        $('status').textContent = 'Microphone Check...';
        $('micCheckStartBtn').disabled = true;
      } catch (e) {
        alert('Mic access denied: ' + e.message);
      }
    }

    function setupMeter(stream) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      src.connect(analyser);
      const data = new Uint8Array(analyser.frequencyBinCount);
      const bar = $('meterBar');

      function draw() {
        analyser.getByteFrequencyData(data);
        // simple average
        let sum = 0; for (let i = 0; i < data.length; i++) sum += data[i];
        const avg = sum / data.length;
        const pct = Math.min(100, avg * 2.5); // amplify a bit
        bar.style.width = pct + '%';
        meterRAF = requestAnimationFrame(draw);
      }
      draw();
    }

    function stopMeter() {
      if (meterRAF) cancelAnimationFrame(meterRAF);
      $('meterBar').style.width = '0%';
    }

    function setupRecognition() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { $('status').textContent = 'Web Speech API not supported.'; return; }
      recognition = new SR();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = $('accentSelect').value;

      recognition.onstart = () => { listening = true; $('status').textContent = 'Listening...'; };
      recognition.onend = () => {
        listening = false;
        if (keepRecognizing) recognition.start();
        else { $('status').textContent = 'Stopped.'; $('startBtn').disabled = false; $('stopBtn').disabled = true; }
      };

      recognition.onresult = (ev) => {
        let final = '', interim = '';
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          if (ev.results[i].isFinal) final += ev.results[i][0].transcript;
          else interim += ev.results[i][0].transcript;
        }
        // Easy append strategy for demo (in production reset final properly)
        const cur = $('recognized').value;
        // Note: This logic is simple; sophisticated apps handle cursor. 
        // Here we just overwrite for simplicity on continuous updates
        // To handle "append final", we'd need a state variable for accumulated text.
        // Let's rely on full rewrite for this snippet:

        // Actually, getting full text from recognition session:
        let fullRes = '';
        // Warning: on continuous, results array grows. 
        for (let i = 0; i < ev.results.length; i++) {
          fullRes += ev.results[i][0].transcript;
        }
        $('recognized').value = fullRes;
        calcAndRender();
      };
    }
    setupRecognition();

    $('accentSelect').onchange = () => {
      if (recognition) recognition.lang = $('accentSelect').value;
    };

    $('startBtn').onclick = async () => {
      $('recognized').value = '';
      keepRecognizing = true;

      // Mic prep
      if (micCheckStream) {
        // reuse or stop? better stop to clean slate
        micCheckStream.getTracks().forEach(t => t.stop());
        micCheckStream = null;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        setupMeter(stream);

        mediaRecorder = new MediaRecorder(stream);
        recordedChunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          stopMeter();
          const blob = new Blob(recordedChunks, { type: 'audio/webm' });
          const url = URL.createObjectURL(blob);
          $('previewAudio').src = url;
          $('previewWrap').style.display = 'block';
        };
        
        // 録音開始
        mediaRecorder.start();
        recognition.start();
        $('startBtn').disabled = true;
        $('stopBtn').disabled = false;

        // Shadowing Mode: audio_file列から音声ファイルが設定されている場合
        if ($('shadowingWrap').style.display !== 'none') {
          const audio = $('shadowAudio');
          if (audio.src) {
            // 録音開始後2秒で音声再生開始
            setTimeout(() => {
              audio.playbackRate = Number($('shadowRate').value);
              audio.currentTime = 0;
              audio.play();
              $('shadowCountdown').textContent = '再生中...';
              
              // 音声再生終了後5秒で録音停止
              audio.onended = () => {
                $('shadowCountdown').textContent = '5';
                setTimeout(() => {
                  $('shadowCountdown').textContent = '4';
                  setTimeout(() => {
                    $('shadowCountdown').textContent = '3';
                    setTimeout(() => {
                      $('shadowCountdown').textContent = '2';
                      setTimeout(() => {
                        $('shadowCountdown').textContent = '1';
                        setTimeout(() => {
                          // 録音停止
                          keepRecognizing = false;
                          if (recognition) recognition.stop();
                          if (mediaRecorder && mediaRecorder.state === 'recording') {
                            mediaRecorder.stop();
                          }
                          $('shadowCountdown').textContent = '停止';
                          $('startBtn').disabled = false;
                          $('stopBtn').disabled = true;
                        }, 1000);
                      }, 1000);
                    }, 1000);
                  }, 1000);
                }, 1000);
              };
            }, 2000);
          }
        }

      } catch (e) { alert('Error: ' + e.message); }
    };

    $('stopBtn').onclick = () => {
      keepRecognizing = false;
      if (recognition) recognition.stop();
      if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
      const audio = $('shadowAudio');
      audio.pause();
      audio.onended = null; // イベントハンドラをクリア
      $('shadowCountdown').textContent = '—';
    };

    $('micCheckStartBtn').onclick = startMicCheck;

    /* --- Data Loading (Google Apps Script) --- */

    // Cache for PassageBooks
    const CACHE_KEY = 'pb_index_v2';
    let PB_INDEX = loadCache();
    function loadCache() { try { return JSON.parse(localStorage.getItem(CACHE_KEY) || '{"books":[]}'); } catch (e) { return { books: [] }; } }
    function saveCache() { localStorage.setItem(CACHE_KEY, JSON.stringify(PB_INDEX)); }
    function findBook(id) { return PB_INDEX.books.find(b => b.fileId === id); }

    function setLoading(el, isLoading) {
      if (isLoading) {
        el.dataset.orig = el.textContent;
        el.innerHTML = '<span class="loader"></span> Loading...';
        el.disabled = true;
      } else {
        el.innerHTML = el.dataset.orig || el.textContent;
        if (el.id.includes('Refresh')) el.textContent = '🔄';
        el.disabled = false;
      }
    }

    // 1. Load Books
    function loadBooks() {
      const sel = $('bookSelect');
      sel.innerHTML = '<option>Loading...</option>';
      sel.disabled = true;

      // Use cache first
      if (PB_INDEX.books.length > 0) renderBookSelect();

      google.script.run
        .withSuccessHandler(list => {
          PB_INDEX.books = list.map(b => ({ fileId: b.fileId, fileName: b.fileName, sheets: [] })); // Reset structure
          saveCache();
          renderBookSelect();
        })
        .withFailureHandler(e => { alert('Failed to load books: ' + e); })
        .getPassageBooks();
    }

    function renderBookSelect() {
      const sel = $('bookSelect');
      sel.innerHTML = '<option value="">— Select Book —</option>';
      PB_INDEX.books.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.fileId;
        opt.textContent = b.fileName;
        sel.appendChild(opt);
      });
      sel.disabled = false;
    }

    $('bookSelect').addEventListener('change', function () {
      const bookId = this.value;
      resetSelectors(['sheetSelect', 'passageSelect']);
      if (!bookId) return;

      loadSheets(bookId);
    });

    function loadSheets(bookId) {
      const sel = $('sheetSelect');
      sel.disabled = true; sel.innerHTML = '<option>Loading...</option>';

      // Check cache
      const book = findBook(bookId);
      if (book && book.sheets && book.sheets.length > 0) {
        renderSheetSelect(book.sheets);
      }

      google.script.run
        .withSuccessHandler(list => {
          if (book) book.sheets = list.map(n => ({ name: n, passages: [] }));
          saveCache();
          renderSheetSelect(book.sheets);
        })
        .getSheetsInBook(bookId);
    }

    function renderSheetSelect(sheets) {
      const sel = $('sheetSelect');
      sel.innerHTML = '<option value="">— Select Sheet —</option>';
      if (!sheets) return;
      sheets.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.name;
        opt.textContent = s.name;
        sel.appendChild(opt);
      });
      sel.disabled = false;
      $('refreshSheetsBtn').disabled = false;
    }

    $('sheetSelect').addEventListener('change', function () {
      const sheetName = this.value;
      resetSelectors(['passageSelect']);
      if (!sheetName) return;

      loadPassages($('bookSelect').value, sheetName);
    });

    function loadPassages(bookId, sheetName) {
      const sel = $('passageSelect');
      sel.disabled = true; sel.innerHTML = '<option>Loading...</option>';

      const book = findBook(bookId);
      const sheet = book?.sheets?.find(s => s.name === sheetName);
      if (sheet && sheet.passages && sheet.passages.length > 0) {
        renderPassageSelect(sheet.passages);
      }

      google.script.run
        .withSuccessHandler(list => {
          if (sheet) sheet.passages = list;
          saveCache();
          renderPassageSelect(list);
        })
        .listPassageHeads(bookId, sheetName);
    }

    function renderPassageSelect(list) {
      const sel = $('passageSelect');
      sel.innerHTML = '<option value="">— Select Passage —</option>';
      if (!list) return;
      list.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = `${p.id}: ${p.title}`;
        sel.appendChild(opt);
      });
      sel.disabled = false;
      $('refreshPassagesBtn').disabled = false;
    }

    $('passageSelect').addEventListener('change', function () {
      const id = this.value;
      if (!id) return;

      const bookId = $('bookSelect').value;
      const sheetName = $('sheetSelect').value;

      $('displayText').value = 'Loading text...';

      google.script.run
        .withSuccessHandler(res => {
          $('fullText').value = res.text; // Store full text for validation? 
          // In original logic: full text is for scoring (res.text here is full or display?)
          // Wait, server returns {id, title, text}. 
          // We need "full" text for scoring diff, and "display" text for reading.
          // Let's assume for now we use 'display' call for UI.

          // audio_file列から音声ファイルが指定されている場合
          if (res.audioFile) {
            // Shadowing Mode (audio_file列から)
            $('displayTextWrap').style.display = 'none';
            $('shadowingWrap').style.display = 'block';

            // Audio Setup
            const a = $('shadowAudio');
            a.src = res.audioFile;
            a.load(); // 音声ファイルを読み込み
            $('shadowNote').textContent = '音声ファイルが設定されています。録音開始後、2秒後に音声が再生されます。';
          } else if (res.isAudioUrl) {
            // Shadowing Mode (text_displayがURLの場合 - 既存の動作)
            $('displayTextWrap').style.display = 'none';
            $('shadowingWrap').style.display = 'block';

            // Audio Setup
            const a = $('shadowAudio');
            const dlUrl = res.text.replace(/\/file\/d\/(.+)\/.*/, '/uc?export=download&id=$1');
            a.src = dlUrl;
            a.load();
            $('shadowNote').textContent = '音声URLが設定されています。録音開始後、2秒後に音声が再生されます。';
          } else {
            // Text Mode
            $('displayTextWrap').style.display = 'block';
            $('shadowingWrap').style.display = 'none';
            $('displayText').value = res.text;
            $('fullText').value = res.text; // Simplification: assume display==full for scoring unless requested otherwise
          }

          validateStart();
        })
        .getPassageText(bookId, sheetName, id, 'display');

      // Also fetch Hidden Full Text if needed? 
      // For simplicity, let's assume Display Text is enough for scoring for now, 
      // OR add a secondary fetch if accuracy matters.
      // *Self-correction*: The original code used 'display' for view and stored it. 
      // Scoring used whatever was in 'fullText'. 
      // Let's implicitly fetch full text too for 'fullText' hidden input.
      google.script.run.withSuccessHandler(r => $('fullText').value = r.text)
        .getPassageText(bookId, sheetName, id, 'full');
    });

    function resetSelectors(ids) {
      ids.forEach(id => {
        const el = $(id);
        el.innerHTML = '<option value="">— Select —</option>';
        el.disabled = true;
      });
      $('displayText').value = '';
      $('fullText').value = '';
      validateStart();
    }

    /* --- Form Validation --- */
    function validateStart() {
      const ok = $('studentId').value && $('studentName').value && $('passageSelect').value;
      if (ok && !listening) $('startBtn').disabled = false;
      else $('startBtn').disabled = true;
    }
    ['studentId', 'studentName'].forEach(id => $(id).addEventListener('input', validateStart));

    /* --- Refresh Buttons --- */
    $('refreshBooksBtn').onclick = function () {
      setLoading(this, true);
      // clear cache for books
      PB_INDEX.books = []; saveCache();
      loadBooks();
      setLoading(this, false);
    };

    $('refreshSheetsBtn').onclick = function () {
      const bid = $('bookSelect').value;
      if (!bid) return;
      setLoading(this, true);
      // clear sheets for this book
      const b = findBook(bid); if (b) b.sheets = []; saveCache();
      loadSheets(bid);
      setLoading(this, false);
    };

    $('refreshPassagesBtn').onclick = function () {
      const bid = $('bookSelect').value;
      const sname = $('sheetSelect').value;
      if (!bid || !sname) return;
      setLoading(this, true);
      const b = findBook(bid);
      const s = b?.sheets?.find(x => x.name === sname);
      if (s) s.passages = []; saveCache();
      loadPassages(bid, sname);
      setLoading(this, false);
    };

    /* --- Scroll --- */
    function scrollT(delta) { $('displayText').scrollTop += delta; }
    $('scrollUp').onclick = () => scrollT(-30);
    $('scrollDown').onclick = () => scrollT(30);

    // Initial Load
    loadBooks();

    // Save/Submit (Stub - just alerts for now, implement real submit if needed or use previous logic)
    $('saveBtn').onclick = function () {
      const p = {
        bookName: $('bookSelect').options[$('bookSelect').selectedIndex].text,
        unitName: $('sheetSelect').value,
        passageLabel: $('passageSelect').value,
        studentId4: $('studentId').value,
        studentName: $('studentName').value,
        recognizedText: $('recognized').value,
        score: $('score').textContent,
        variant: $('accentSelect').value,
        readWhileViewing: 'true' // dummy
      };
      google.script.run
        .withSuccessHandler(res => {
          $('submitStatusBottom').textContent = '提出完了: ' + res.filename;
          $('submitStatusBottom').className = 'status-badge ok';
          alert('Submitted successfully!');
        })
        .withFailureHandler(e => alert('Error: ' + e))
        .enqueueSubmission(p);
    };

  </script>
</body>
